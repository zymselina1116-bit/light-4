<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Piano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main container for the light dots -->
    <div id="piano-container">
        <div id="note-grid"></div>

        <!-- Instructions overlay -->
        <div id="instructions">
            <p>Press keyboard keys to play: A S D F G H J K L</p>
            <p>Or: Q W E R T Y U I O P</p>
            <p class="subtitle">Press any key to start</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
