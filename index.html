<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Halo Piano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas for light halos -->
    <canvas id="light-canvas"></canvas>

    <!-- Instructions overlay -->
    <div id="instructions">
        <p>LIGHT HALO PIANO</p>
        <p style="font-size: 14px; opacity: 0.7; margin-top: 20px;">
            Play keyboard to create glowing halos<br>
            35 keys • Each key = unique color
        </p>
        <p class="subtitle">Press any key to begin</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
