<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Piano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main container for the light dots -->
    <div id="piano-container">
        <div id="note-grid"></div>

        <!-- Instructions overlay -->
        <div id="instructions">
            <p>35-KEY LIGHT PIANO</p>
            <p style="font-size: 14px; opacity: 0.7; margin-top: 20px;">
                Numbers: 1 2 3 4 5 6 7 8<br>
                Top: Q W E R T Y U I O P<br>
                Mid: A S D F G H J K L ;<br>
                Low: Z X C V B N M
            </p>
            <p class="subtitle">Press any key to start</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
